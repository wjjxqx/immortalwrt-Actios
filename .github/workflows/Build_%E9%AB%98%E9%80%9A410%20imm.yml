name: 馃殌 Build_imm_澶氬钩鍙?
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' �?閫夋嫨鏄惁寮€�?SSH 璋冭瘯涓撲笟浜哄憳浣跨敤'
        required: false
        default: false
        type: boolean
      profile:
        description: ' �?鏀寔澶氭鍨嬪彿 鎵嬪姩閫夋嫨瑕佺紪璇戠殑鏈哄�?�?'
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
          - hyperv
          - ghl-r-001
        default: ufi003
        required: true
      upstream:
        description: ' �?閫夋嫨涓婃父婧愮爜浠撳簱 �?'
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' �?鎸囧�?hash锛堥粯璁や笉鐢ㄥ～鍐欙級�?'
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' �?杈撳叆棰濆鍖呭悕锛堥€楀彿鎴栫┖鏍煎垎闅旓紝鐣欑┖鍒欎笉娣诲姞浠讳綍棰濆鍖咃級�?'
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream || github.event.client_payload.upstream || 'lkiuyu/immortalwrt' }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: 馃殌 缂栬�?(Build)
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: mkbootimg build
      if: ${{ inputs.profile != 'hyperv' && inputs.profile != 'ghl-r-001' }}
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 楠岃瘉瀹夎�?
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
        echo "mkbootimg found at: $MKBOOTIMG_PATH"
        file "$MKBOOTIMG_PATH"
        else
        echo "�?mkbootimg not found in PATH!"
        fi

    - name: Set timezone and prep /mnt
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT
        
    - name: Ensure Python build tools
      run: |
       python3 -m pip cache purge
       python3 -m pip install --upgrade --force-reinstall pip
       python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
       python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
       python3 -m pip install --upgrade cython packaging tomli
       python3 -m pip install Unidecode pyelftools
       python3 -m pip --version
       python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"



    - name: 璇诲彇閿佸畾鐨勪笂娓?hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "浣跨敤鐢ㄦ埛鎸囧�?hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "浣跨敤閿佸畾 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 涓嶅瓨鍦紝浣跨敤鏈€鏂?master"
        fi

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

    - name:  files
      run: cp -r files openwrt/files

    - name: Load custom feeds
      run: |
        echo "FEEDS_CONF=$FEEDS_CONF"
        echo "DIY_P1_SH=$DIY_P1_SH"
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        if [ -e "$FEEDS_CONF" ]; then
          echo "FEEDS_CONF exists, copying to openwrt/feeds.conf.default"
          mkdir -p openwrt
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
          echo "Copied feeds.conf"
        else
          echo "WARNING: FEEDS_CONF not found at $FEEDS_CONF"
        fi
        if [ -x "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          echo "DIY_P1_SH is executable"
        else
          echo "DIY_P1_SH not executable, fixing"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        fi
        echo "Running DIY_P1_SH from $GITHUB_WORKSPACE/$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
        

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove conflicting packages from smpackage
      run: |
        # 鍒犻�?small-package 涓笌绯荤粺鍐茬獊鐨勫寘锛岄伩鍏嶇紪璇戞姤閿欙紙瀹樻柟鎺ㄨ崘鎿嶄綔锛?        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install extra packages
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "User requested extra packages:"
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="

        # 鎻愬彇绯荤粺璁剧疆鍙傛暟锛坃_ip__ �?__hostname__ 鍓嶇紑锛?        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        # 搴旂敤鑷畾�?IP
        if [ -n "$CUSTOM_IP" ]; then
          echo "馃寪 璁剧疆绠＄悊 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.1\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        # 搴旂敤鑷畾涔変富鏈哄悕
        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "馃彿�?璁剧疆涓绘満�? $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        # 杩囨护鎺夌壒娈婂墠缂€锛屽彧澶勭悊鐪熸鐨勫寘鍚?        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        # 妫€娴嬫槸鍚﹂€変簡 turboacc锛屽鏋滈€変簡鍒欏厛鎵ц瀹夎鑴氭湰
        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "�?妫€娴嬪�?luci-app-turboacc锛屾墽琛?turboacc 瀹夎鑴氭湰..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "鈿狅�?turboacc 鑴氭湰鎵ц澶辫触锛岃烦杩?
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "�?Enabled (replaced): ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "�?Enabled (updated): ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "�?Enabled (appended): ${CFG}=y"
            fi
          fi
        done
        
        
    - name: SSH 璋冭瘯鏈夋晥鏃堕�?h! 杩炴帴鍚庤緭鍏 杈撳叆exit鍗冲彲閫€鍑猴紝鑷姩缁х画鍚庣画缂栬瘧娴佺▼
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
      
    - name: Config defconfig
      id: config
      run: |
       cd openwrt
       make defconfig
       # 寮哄埗闄嶇骇 GCC 鐗堟湰锛岄伩�?musl __REDIR 鍏煎鎬ч棶棰?       sed -i '/^CONFIG_GCC_VERSION=/d' .config
       echo 'CONFIG_GCC_VERSION="15.2.0"' >> .config
       # 绂佺�?musl __REDIR 瀹忚Е鍙戠�?implicit-int 閿欒�?
       echo 'CONFIG_TARGET_CFLAGS="-Wno-error=implicit-int"' >> .config
       
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j4 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 鏌ョ�?openwrt 鐩�?
      run: |
        ls -la openwrt/
        ls -l .config
        ls -la openwrt/.config

    - name: 鑷姩涓婁紶鏈€鏂版簮鐮佺敓�?config缂栬瘧閰嶇疆
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true


    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get kernel version
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "鏈�?)
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Fix Git buffer
      run: git config --global http.postBuffer 524288000

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE=${{ github.event.inputs.profile }}

        # 鍒涘缓鍒锋満鍖呯洰褰曞苟鎵撳�?zip
        mkdir -p flash_package
        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_鍥轰欢鍖?zip"

        # ===== �?target 鍒嗘敮锛氳瘑鍒骇鐗╃被�?=====
        # 楂橀�?msm8916 �?boot.img + system.img锛圓ndroid 鍒嗗尯闀滃儚�?        # x86/64       �?combined.img / combined.vhdx / vmdk / qcow2锛圙RUB+grub2�?        # ramips/mt7621�?*-squashfs-sysupgrade.bin锛圲-Boot/NAND sysupgrade�?        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1)

        if [ -n "$BOOT_IMG" ] && [ -n "$SYSTEM_IMG" ]; then
          # ---------- 楂橀�?msm8916锛歜oot + system.img 鍒锋満�?----------
          echo "PACKAGE_TYPE=qualcomm-boot-system" >> $GITHUB_ENV
          echo ">>> 妫€娴嬪埌楂橀�?msm8916 浜х墿锛歜oot.img + system.img"
          cp "$BOOT_IMG" flash_package/boot.img.gz
          cp "$SYSTEM_IMG" flash_package/system.img.gz
          # 瑙ｅ帇渚涘埛鏈鸿剼鏈娇�?          gzip -dk flash_package/boot.img.gz
          gzip -dk flash_package/system.img.gz
          rm flash_package/boot.img.gz flash_package/system.img.gz
          cp -r $GITHUB_WORKSPACE/鍒锋満鑴氭�?. flash_package/
          # 纭�?bat 鏂囦欢鏄?CRLF 鎹㈣锛圵indows 鍏煎锛?          unix2dos flash_package/*.bat 2>/dev/null || sed -i 's/\r//' flash_package/*.bat && sed -i 's/$/\r/' flash_package/*.bat
        else
          # ---------- x86/64 �?ramips锛氶€氱敤鍥轰欢鍖咃紙涓嶈繃婊わ紝鍏ㄩ噺浜х墿�?----------
          echo ">>> 闈為珮閫氫骇鐗╋紝閲囩敤閫氱敤鍥轰欢鍖咃紙x86/64 �?ramips�?
          # 鏀堕泦鎵€鏈夊浐浠朵骇鐗╀笌缂栬瘧淇℃伅锛屾帓�?packages/ 瀛愮洰褰?          for f in $(ls -1 | grep -vE '^packages$'); do
            [ -f "$f" ] && cp -p "$f" flash_package/
          done
          # 楂橀€氬埛鏈鸿剼鏈粎閫傜敤�?msm89xx锛屽叾浠?target 涓嶆墦鍖?          if [ -d "$GITHUB_WORKSPACE/鍒锋満鑴氭�? ]; then
            echo ">>> 璺宠繃鍒锋満鑴氭湰锛堥潪楂橀�?target�?
          fi
          # 鏍￠獙锛氬繀椤昏嚦灏戞湁涓€涓浐浠朵骇�?          COUNT=$(ls -1 flash_package | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::鍥轰欢鏂囦欢鏈壘鍒帮紝缂栬瘧鍙兘澶辫触锛佸綋鍓嶇洰褰曟枃浠讹�?
            ls -la
            exit 1
          fi
          echo ">>> 宸叉敹闆?$COUNT 涓浐浠朵骇�?
          ls -lh flash_package
        fi

        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 鏁寸�?release 鐩綍锛歾ip + 鍗曠嫭鍥轰欢 + 缂栬瘧淇℃伅
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        PROFILE=${{ github.event.inputs.profile }}
        # 鎻愬彇鐢ㄦ埛璁剧疆鐨?IP 鍜屼富鏈哄悕
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.1.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        # 杩囨护鎺夌壒娈婂墠缂€锛屽彧鏄剧ず鐪熸鐨勫寘鍚?        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master鍒嗘�?�?${PROFILE}"
          echo ""
          echo "| 椤圭�?| 淇℃�?|"
          echo "|------|------|"
          echo "| 缂栬瘧鑰?| ${{ github.actor }} |"
          echo "| 鏈哄�?| ${PROFILE} |"
          echo "| 鍐呮牳鐗堟湰 | ${{ env.KERNEL_VER }} |"
          echo "| 绠＄悊鍦板潃 | ${DISPLAY_IP} |"
          echo "| 涓绘満�?| ${DISPLAY_HOSTNAME} |"
          echo "| 榛樿鐢ㄦ埛 | root |"
          echo "| 榛樿瀵嗙�?| �?|"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 棰濆娣诲姞鐨勫�?
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 棰濆娣诲姞鐨勫�?
            echo "�?
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT



    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }



    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi


