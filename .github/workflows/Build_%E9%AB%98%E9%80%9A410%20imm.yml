name: 棣冩畬 Build_imm_婢舵艾閽╅崣?
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' 閳?闁瀚ㄩ弰顖氭儊瀵偓閸?SSH 鐠嬪啳鐦稉鎾茬瑹娴滃搫鎲虫担璺ㄦ暏'
        required: false
        default: false
        type: boolean
      profile:
        description: ' 閳?閺€顖涘瘮婢舵碍顑欓崹瀣娇 閹靛濮╅柅澶嬪鐟曚胶绱拠鎴犳畱閺堝搫鐎?閳?'
        type: choice
        options:
          - ufi003
          - ufi001c
          - ufi001b
          - ufi103s
          - jz02v10
          - qrzl903
          - w001
          - uz801
          - mf32
          - mf601
          - wf2
          - sp970v11
          - sp970v10
          - hyperv
          - ghl-r-001
        default: ufi003
        required: true
      upstream:
        description: ' 閳?闁瀚ㄦ稉濠冪埗濠ф劗鐖滄禒鎾崇氨 閳?'
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' 閳?閹稿洤鐣?hash閿涘牓绮拋銈勭瑝閻劌锝為崘娆欑礆閳?'
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' 閳?鏉堟挸鍙嗘０婵嗩樆閸栧懎鎮曢敍鍫モ偓妤€褰块幋鏍敄閺嶇厧鍨庨梾鏃撶礉閻ｆ瑧鈹栭崚娆庣瑝濞ｈ濮炴禒璁崇秿妫版繂顦婚崠鍜冪礆閳?'
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream || github.event.client_payload.upstream || 'lkiuyu/immortalwrt' }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}.config', github.event.inputs.profile) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: 棣冩畬 缂傛牞鐦?(Build)
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh
  
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true
        
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: mkbootimg build
      if: ${{ inputs.profile != 'hyperv' && inputs.profile != 'ghl-r-001' }}
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        # 妤犲矁鐦夌€瑰顥?
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
        echo "mkbootimg found at: $MKBOOTIMG_PATH"
        file "$MKBOOTIMG_PATH"
        else
        echo "閴?mkbootimg not found in PATH!"
        fi

    - name: Set timezone and prep /mnt
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT
        
    - name: Ensure Python build tools
      run: |
       python3 -m pip cache purge
       python3 -m pip install --upgrade --force-reinstall pip
       python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
       python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
       python3 -m pip install --upgrade cython packaging tomli
       python3 -m pip install Unidecode pyelftools
       python3 -m pip --version
       python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"



    - name: 鐠囪褰囬柨浣哥暰閻ㄥ嫪绗傚〒?hash (Read locked upstream hash)
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "娴ｈ法鏁ら悽銊﹀煕閹稿洤鐣?hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "娴ｈ法鏁ら柨浣哥暰 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "upstream_lock.txt 娑撳秴鐡ㄩ崷顭掔礉娴ｈ法鏁ら張鈧弬?master"
        fi

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt

    - name:  files
      run: cp -r files openwrt/files

    - name: Load custom feeds
      run: |
        echo "FEEDS_CONF=$FEEDS_CONF"
        echo "DIY_P1_SH=$DIY_P1_SH"
        echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
        if [ -e "$FEEDS_CONF" ]; then
          echo "FEEDS_CONF exists, copying to openwrt/feeds.conf.default"
          mkdir -p openwrt
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
          echo "Copied feeds.conf"
        else
          echo "WARNING: FEEDS_CONF not found at $FEEDS_CONF"
        fi
        if [ -x "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          echo "DIY_P1_SH is executable"
        else
          echo "DIY_P1_SH not executable, fixing"
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
        fi
        echo "Running DIY_P1_SH from $GITHUB_WORKSPACE/$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"
        

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Remove conflicting packages from smpackage
      run: |
        # 閸掔娀娅?small-package 娑擃厺绗岀化鑽ょ埠閸愯尙鐛婇惃鍕瘶閿涘矂浼╅崗宥囩椽鐠囨垶濮ら柨娆欑礄鐎规ɑ鏌熼幒銊ㄥ礃閹垮秳缍旈敍?        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a -f

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Install extra packages
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "User requested extra packages:"
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="

        # 閹绘劕褰囩化鑽ょ埠鐠佸墽鐤嗛崣鍌涙殶閿涘潈_ip__ 閸?__hostname__ 閸撳秶绱戦敍?        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        # 鎼存梻鏁ら懛顏勭暰娑?IP
        if [ -n "$CUSTOM_IP" ]; then
          echo "棣冨 鐠佸墽鐤嗙粻锛勬倞 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.1\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        # 鎼存梻鏁ら懛顏勭暰娑斿瀵岄張鍝勬倳
        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "棣冨娇閿?鐠佸墽鐤嗘稉缁樻簚閸? $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        # 鏉╁洦鎶ら幒澶屽濞堝﹤澧犵紓鈧敍灞藉涧婢跺嫮鎮婇惇鐔割劀閻ㄥ嫬瀵橀崥?        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        # 濡偓濞村妲搁崥锕傗偓澶夌啊 turboacc閿涘苯顩ч弸婊堚偓澶夌啊閸掓瑥鍘涢幍褑顢戠€瑰顥婇懘姘拱
        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "閳?濡偓濞村鍩?luci-app-turboacc閿涘本澧界悰?turboacc 鐎瑰顥婇懘姘拱..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "閳跨媴绗?turboacc 閼存碍婀伴幍褑顢戞径杈Е閿涘矁鐑︽潻?
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "閴?Enabled (replaced): ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "閴?Enabled (updated): ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "閴?Enabled (appended): ${CFG}=y"
            fi
          fi
        done

    - name: Disable baresip package to avoid build error
      run: |
        cd openwrt
        # Disable baresip package if present in .config
        if grep -q "CONFIG_PACKAGE.*baresip" .config; then
          sed -i "s/\\\\(CONFIG_PACKAGE.*baresip\\\)=.*)/# \\1 is not set/" .config
          echo "Disabled baresip package in .config"
        else
          echo "No baresip package found in .config"
        fi

        
        
    - name: SSH 鐠嬪啳鐦張澶嬫櫏閺冨爼妫?h! 鏉╃偞甯撮崥搴ょ翻閸忣櫡 鏉堟挸鍙唀xit閸楀啿褰查柅鈧崙鐚寸礉閼奉亜濮╃紒褏鐢婚崥搴ｇ敾缂傛牞鐦уù浣衡柤
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}
      
      
    - name: Config defconfig
      id: config
      run: |
       cd openwrt
       make defconfig
       # 瀵搫鍩楅梽宥囬獓 GCC 閻楀牊婀伴敍宀勪缉閸?musl __REDIR 閸忕厧顔愰幀褔妫舵０?       sed -i '/^CONFIG_GCC_VERSION=/d' .config
       echo 'CONFIG_GCC_VERSION="15.2.0"' >> .config
       # 缁備胶鏁?musl __REDIR 鐎瑰繗袝閸欐垹娈?implicit-int 闁挎瑨顕?
       echo 'CONFIG_TARGET_CFLAGS="-Wno-error=implicit-int"' >> .config
       
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j4 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 閺屻儳婀?openwrt 閻╊喖缍?
      run: |
        ls -la openwrt/
        ls -l .config
        ls -la openwrt/.config

    - name: 閼奉亜濮╂稉濠佺炊閺堚偓閺傜増绨惍浣烘晸閹?config缂傛牞鐦ч柊宥囩枂
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true


    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Get kernel version
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "閺堫亞鐓?)
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV


    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Fix Git buffer
      run: git config --global http.postBuffer 524288000

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE=${{ github.event.inputs.profile }}

        # 閸掓稑缂撻崚閿嬫簚閸栧懐娲拌ぐ鏇炶嫙閹垫挸瀵?zip
        mkdir -p flash_package
        ZIP_NAME="OpenWrt_${PROFILE}${{ env.FILE_DATE }}_閸ヨ桨娆㈤崠?zip"

        # ===== 閹?target 閸掑棙鏁敍姘崇槕閸掝偂楠囬悧鈺冭閸?=====
        # 妤傛﹢鈧?msm8916 閳?boot.img + system.img閿涘湏ndroid 閸掑棗灏梹婊冨剼閿?        # x86/64       閳?combined.img / combined.vhdx / vmdk / qcow2閿涘湙RUB+grub2閿?        # ramips/mt7621閳?*-squashfs-sysupgrade.bin閿涘湶-Boot/NAND sysupgrade閿?        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img 2>/dev/null | head -1)

        if [ -n "$BOOT_IMG" ] && [ -n "$SYSTEM_IMG" ]; then
          # ---------- 妤傛﹢鈧?msm8916閿涙瓬oot + system.img 閸掗攱婧€閸?----------
          echo "PACKAGE_TYPE=qualcomm-boot-system" >> $GITHUB_ENV
          echo ">>> 濡偓濞村鍩屾姗€鈧?msm8916 娴溠呭⒖閿涙瓬oot.img + system.img"
          cp "$BOOT_IMG" flash_package/boot.img.gz
          cp "$SYSTEM_IMG" flash_package/system.img.gz
          # 鐟欙絽甯囨笟娑樺煕閺堥缚鍓奸張顑垮▏閻?          gzip -dk flash_package/boot.img.gz
          gzip -dk flash_package/system.img.gz
          rm flash_package/boot.img.gz flash_package/system.img.gz
          cp -r $GITHUB_WORKSPACE/閸掗攱婧€閼存碍婀?. flash_package/
          # 绾喕绻?bat 閺傚洣娆㈤弰?CRLF 閹广垼顢戦敍鍦礽ndows 閸忕厧顔愰敍?          unix2dos flash_package/*.bat 2>/dev/null || sed -i 's/\r//' flash_package/*.bat && sed -i 's/$/\r/' flash_package/*.bat
        else
          # ---------- x86/64 娑?ramips閿涙岸鈧氨鏁ら崶杞版閸栧拑绱欐稉宥堢箖濠娿倧绱濋崗銊╁櫤娴溠呭⒖閿?----------
          echo ">>> 闂堢偤鐝柅姘獓閻椻晪绱濋柌鍥╂暏闁氨鏁ら崶杞版閸栧拑绱檟86/64 閹?ramips閿?
          # 閺€鍫曟肠閹碘偓閺堝娴愭禒鏈甸獓閻椻晙绗岀紓鏍槯娣団剝浼呴敍灞惧笓闂?packages/ 鐎涙劗娲拌ぐ?          for f in $(ls -1 | grep -vE '^packages$'); do
            [ -f "$f" ] && cp -p "$f" flash_package/
          done
          # 妤傛﹢鈧艾鍩涢張楦垮壖閺堫兛绮庨柅鍌滄暏娴?msm89xx閿涘苯鍙炬禒?target 娑撳秵澧﹂崠?          if [ -d "$GITHUB_WORKSPACE/閸掗攱婧€閼存碍婀? ]; then
            echo ">>> 鐠哄疇绻冮崚閿嬫簚閼存碍婀伴敍鍫ユ姜妤傛﹢鈧?target閿?
          fi
          # 閺嶏繝鐛欓敍姘箑妞ゆ槒鍤︾亸鎴炴箒娑撯偓娑擃亜娴愭禒鏈甸獓閻?          COUNT=$(ls -1 flash_package | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::閸ヨ桨娆㈤弬鍥︽閺堫亝澹橀崚甯礉缂傛牞鐦ч崣顖濆厴婢惰精瑙﹂敍浣哥秼閸撳秶娲拌ぐ鏇熸瀮娴犺绱?
            ls -la
            exit 1
          fi
          echo ">>> 瀹稿弶鏁归梿?$COUNT 娑擃亜娴愭禒鏈甸獓閻?
          ls -lh flash_package
        fi

        cd flash_package && zip -r "../$ZIP_NAME" . && cd ..

        # 閺佸鎮?release 閻╊喖缍嶉敍姝緄p + 閸楁洜瀚崶杞版 + 缂傛牞鐦ф穱鈩冧紖
        mkdir -p release_files
        mv "$ZIP_NAME" release_files/
        cp *.manifest release_files/ 2>/dev/null || true
        cp *.buildinfo release_files/ 2>/dev/null || true
        cp sha256sums release_files/ 2>/dev/null || true

        echo "FIRMWARE=$PWD/release_files" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        PROFILE=${{ github.event.inputs.profile }}
        # 閹绘劕褰囬悽銊﹀煕鐠佸墽鐤嗛惃?IP 閸滃奔瀵岄張鍝勬倳
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.1.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        # 鏉╁洦鎶ら幒澶屽濞堝﹤澧犵紓鈧敍灞藉涧閺勫墽銇氶惇鐔割劀閻ㄥ嫬瀵橀崥?        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master閸掑棙鏁?璺?${PROFILE}"
          echo ""
          echo "| 妞ゅ湱娲?| 娣団剝浼?|"
          echo "|------|------|"
          echo "| 缂傛牞鐦ч懓?| ${{ github.actor }} |"
          echo "| 閺堝搫鐎?| ${PROFILE} |"
          echo "| 閸愬懏鐗抽悧鍫熸拱 | ${{ env.KERNEL_VER }} |"
          echo "| 缁狅紕鎮婇崷鏉挎絻 | ${DISPLAY_IP} |"
          echo "| 娑撶粯婧€閸?| ${DISPLAY_HOSTNAME} |"
          echo "| 姒涙顓婚悽銊﹀煕 | root |"
          echo "| 姒涙顓荤€靛棛鐖?| 缁?|"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### 妫版繂顦诲ǎ璇插閻ㄥ嫬瀵?
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### 妫版繂顦诲ǎ璇插閻ㄥ嫬瀵?
